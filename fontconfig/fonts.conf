<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
  <!-- Artificial oblique for fonts without an italic or oblique version -->
  <match target="font">
    <!-- check to see if the font is roman -->
    <test name="slant">
      <const>roman</const>
    </test>
    <!-- check to see if the pattern requested non-roman -->
    <test compare="not_eq" name="slant" target="pattern">
      <const>roman</const>
    </test>
    <!-- multiply the matrix to slant the font -->
    <edit mode="assign" name="matrix">
      <times>
        <name>matrix</name>
        <matrix>
          <double>1</double>
          <double>0.2</double>
          <double>0</double>
          <double>1</double>
        </matrix>
      </times>
    </edit>
    <!-- pretend the font is oblique now -->
    <edit mode="assign" name="slant">
      <const>oblique</const>
    </edit>
    <!-- and disable embedded bitmaps for artificial oblique -->
    <edit mode="assign" name="embeddedbitmap">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Synthetic emboldening for fonts that do not have bold face available -->
  <match target="font">
    <!-- check to see if the weight in the font is less than medium which possibly need emboldening -->
    <test compare="less_eq" name="weight">
      <const>medium</const>
    </test>
    <!-- check to see if the pattern requests bold -->
    <test compare="more_eq" name="weight" target="pattern">
      <const>bold</const>
    </test>
    <!-- set the embolden flag needed for applications using cairo, e.g. gucharmap, gedit, ... -->
    <edit mode="assign" name="embolden">
      <bool>true</bool>
    </edit>
    <!-- set weight to bold needed for applications using Xft directly, e.g. Firefox, ... -->
    <edit mode="assign" name="weight">
      <const>bold</const>
	</edit>

  </match>

  <match target="pattern">
    <test name="family">
      <string>Noto Sans CJK SC</string>
    </test>
    <test name="weight" compare="eq">
      <const>regular</const>
    </test>
    <edit name="weight" mode="assign" binding="strong">
      <const>medium</const>
    </edit>
	edit
    <test name="family">
      <string>Noto Serif CJK SC</string>
    </test>
    <test name="weight" compare="eq">
      <const>regular</const>
    </test>
    <edit name="weight" mode="assign" binding="strong">
      <const>medium</const>
    </edit>
  </match>


  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <test name="weight" compare="eq">
      <const>regular</const>
    </test>
    <edit name="weight" mode="assign" binding="strong">
      <const>medium</const>
    </edit>
  </match>
  
  <match target="pattern">
    <test name="family">
      <string>Sans</string>
    </test>
    <test name="weight" compare="eq">
      <const>regular</const>
    </test>
    <edit name="weight" mode="assign" binding="strong">
      <const>medium</const>
    </edit>
  </match>

  <!-- 字体渲染清晰度优化 -->
  <match target="font">
    <!-- 开启抗锯齿 -->
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <!-- 开启微调 -->
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <!-- 设置微调风格为 hintfull 以获得最清晰的效果 -->
    <edit name="hintstyle" mode="assign">
      <const>hintfull</const>
    </edit>
    <!-- 启用子像素渲染，并指定 RGB 排列 -->
	<edit name="rgba" mode="assign">
      <const>rgb</const>
	</edit>
    <!-- 设置 LCD 过滤器 -->
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
    <!-- 禁用自动微调，让字体自带信息生效 -->
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  
  <!-- 添加这部分：字体家族优先级设置 -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
